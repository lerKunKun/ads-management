services:
  postgres:
    image: postgres:16-alpine
    container_name: ads_pg
    environment:
      POSTGRES_USER: ads
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ads
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - ./.data/pg:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U ads -d ads]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: ads_redis
    command: [redis-server, --appendonly, yes]
    ports:
      - 127.0.0.1:6379:6379
    volumes:
      - ./.data/redis:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 30

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ads_rabbit
    environment:
      RABBITMQ_DEFAULT_USER: ads
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - 127.0.0.1:5672:5672
      - 127.0.0.1:15672:15672
    volumes:
      - ./.data/rabbit:/var/lib/rabbitmq
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, ping]
      interval: 10s
      timeout: 5s
      retries: 30
